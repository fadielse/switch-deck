<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SwitchDeck</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101216; --panel: #181b21; --line: #262a33; --dim: #8b93a1; --fg: #e6e8ec;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0; padding: 10px; display: flex; flex-direction: column; gap: 10px;
    font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  header { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .host { font-weight: 700; }
  .pill { font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .up { background: #10331f; color: #57d68b; border: 1px solid #1d5c37; }
  .down { background: #34181b; color: #f2777f; border: 1px solid #5e2a2f; }
  .mid { background: #33290f; color: #e2b356; border: 1px solid #5c4a1d; }
  .metrics { margin-left: auto; display: flex; gap: 12px; color: var(--dim); font-size: 12px;
             font-variant-numeric: tabular-nums; }
  .gear { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
          background: var(--panel); color: var(--fg); font-size: 13px; }

  /* Both panels stay mounted. Opening the keyboard shrinks the trackpad
     instead of replacing it, so the deck never leaves the screen. */
  main { flex: 1 1 0; display: flex; gap: 10px; min-height: 0; }

  /* The palm rest must not accept touch. A hand resting there while typing
     would otherwise register as a pointer and corrupt the touches that matter.
     The area is inert; only the deck keys inside it opt back in. */
  .palm {
    flex: 1 1 0; display: flex; flex-direction: column; gap: 8px;
    min-width: 0; overflow-y: auto; pointer-events: none;
  }
  .palm .key { pointer-events: auto; }

  #pad {
    flex: 1.6 1 0; position: relative; border-radius: 14px;
    background: #14181f; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: #4b535f; font-size: 13px; text-align: center;
  }
  #pad.active { border-color: #3d6fd1; background: #161d2b; }
  #pad .badge {
    position: absolute; top: 10px; left: 12px; font-size: 11px; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }

  .key {
    flex: 0 0 auto; min-height: 52px; border-radius: 12px; border: 1px solid #2f3642;
    background: #1f2530; color: var(--fg); font-size: 15px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: transform .06s, background .12s, border-color .12s;
  }
  .key .hint { font-size: 11px; font-weight: 500; color: var(--dim); }
  .key.down { transform: scale(.96); background: #2b3341; }
  .key.ok { background: #10331f; border-color: #1d5c37; }
  .key.fail { background: #34181b; border-color: #5e2a2f; }

  #kbtoggle.on, #fs.on { background: #1f2a3d; border-color: #3d6fd1; color: #9dc0f5; }

  #kb { flex: 1.7 1 0; display: none; flex-direction: column; gap: 5px; min-height: 0; }
  #kb.on { display: flex; }
  /* Magic Keyboard proportions: every row is 15 units wide, and the function
     row sits at roughly two-thirds height like the real thing. */
  .krow { display: flex; gap: 5px; flex: 1 1 0; min-height: 0; }
  .krow.fnrow { flex: 0.62 1 0; }
  .kkey {
    flex: 1 1 0; border-radius: 7px; border: 1px solid #2f3642; background: #1f2530;
    color: var(--fg); font-size: 15px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1px; padding: 0; min-width: 0;
    line-height: 1.05;
  }
  .kkey .sub { font-size: 9px; color: var(--dim); letter-spacing: .02em; }
  .kkey .glyph { font-size: 13px; }
  .kkey .fnum { font-size: 8px; color: #5b636f; letter-spacing: .04em; }
  .kkey.fnactive .fnum { color: #57d68b; }
  .kkey.fnactive .sub, .kkey.fnactive > span:first-child { opacity: .35; }
  /* The arrow cluster is an inverted T: full-height left and right, with up and
     down stacked in the middle column. */
  .arrows { display: flex; gap: 5px; flex: 3 1 0; min-width: 0; }
  .arrows .col { display: flex; flex-direction: column; gap: 5px; flex: 1 1 0; }
  .arrows .col .kkey { flex: 1 1 0; font-size: 12px; }
  /* Not :active. The browser treats activation as singular, so once a finger
     is holding Shift no other key can light up — and preventDefault on
     pointerdown suppresses it anyway. An explicit class is per-element and
     survives any number of simultaneous touches. */
  .kkey.down { background: #3a4560; border-color: #4d7ee0; }
  .kkey { touch-action: none; }
  .kkey.mod { background: #232936; color: var(--dim); font-size: 16px; }
  .kkey.mod.once { background: #1f2a3d; border-color: #3d6fd1; color: #9dc0f5; }
  .kkey.mod.lock { background: #10331f; border-color: #1d5c37; color: #57d68b; }
  .kkey.small { font-size: 12px; }


  #warn { display: none; background: #34181b; border: 1px solid #5e2a2f; color: #f2b0b5;
          border-radius: 10px; padding: 10px 12px; font-size: 12px; flex: 0 0 auto; }

  #settings {
    display: none; position: fixed; inset: auto 10px 10px 10px; z-index: 10;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; gap: 12px; flex-direction: column; max-height: 80vh; overflow-y: auto;
  }
  #settings.open { display: flex; }
  .row { display: flex; align-items: center; gap: 12px; }
  .row label { flex: 0 0 150px; font-size: 13px; color: var(--dim); }
  .row input[type=range] { flex: 1; }
  .row .val { flex: 0 0 52px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }

  #pair { display: none; flex-direction: column; gap: 10px; padding: 20px; }
  #pair input { padding: 14px; font-size: 16px; border-radius: 10px; border: 1px solid var(--line);
                background: var(--panel); color: var(--fg); }
  #pair button { padding: 14px; font-size: 16px; font-weight: 600; border-radius: 10px;
                 border: none; background: #3d6fd1; color: #fff; }
</style>
</head>
<body>

<header>
  <span class="host" id="host">SwitchDeck</span>
  <span class="pill mid" id="status">nyambungin…</span>
  <span class="metrics">
    <span id="lat">— ms</span>
    <span id="rate">— f/s</span>
  </span>
  <button class="gear" id="kbtoggle" title="keyboard">⌨</button>
  <button class="gear" id="fs" title="fullscreen">⛶</button>
  <button class="gear" id="gear">⚙︎</button>
</header>

<div id="warn"></div>

<div id="pair">
  <p style="margin:0;color:var(--dim);font-size:13px">Tempel token dari <code>~/.config/switchdeck/config.json</code>, atau buka lewat link lengkap yang dicetak server.</p>
  <input id="token" placeholder="token" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="save">Simpan &amp; sambung</button>
</div>

<div id="kb"></div>

<main>
  <aside class="palm" id="deck-l"></aside>
  <div id="pad">
    <span class="badge" id="badge"></span>
    <span id="padhint">1 jari — gerak &amp; tap klik · 2 jari — scroll &amp; tap klik kanan · tap-tahan — drag</span>
  </div>
  <aside class="palm" id="deck-r"></aside>
</main>

<div id="settings">
  <div class="row"><label>Sensitivitas</label><input type="range" id="s-sens" min="0.4" max="3" step="0.1"><span class="val" id="v-sens"></span></div>
  <div class="row"><label>Akselerasi</label><input type="range" id="s-accel" min="0" max="4" step="0.1"><span class="val" id="v-accel"></span></div>
  <div class="row"><label>Ping / keepalive<br><span style="font-size:11px">kecil = radio wifi tetap bangun, boros baterai</span></label><input type="range" id="s-keepalive" min="40" max="1000" step="20"><span class="val" id="v-keepalive"></span></div>
  <div class="row"><label>Kehalusan gerak<br><span style="font-size:11px">(1.00 = mentah)</span></label><input type="range" id="s-smooth" min="0.25" max="1" step="0.05"><span class="val" id="v-smooth"></span></div>
  <div class="row"><label>Suara ketik<br><span style="font-size:11px">0 = mati</span></label><input type="range" id="s-click" min="0" max="1" step="0.05"><span class="val" id="v-click"></span></div>
  <div class="row"><label>Kecepatan scroll</label><input type="range" id="s-scroll" min="0.5" max="5" step="0.1"><span class="val" id="v-scroll"></span></div>
  <div class="row"><label>Scroll natural</label><input type="checkbox" id="s-natural"></div>
  <div class="row"><label>Tap buat klik</label><input type="checkbox" id="s-tap"></div>
  <div class="row"><button class="gear" id="close" style="flex:1">Tutup</button></div>
</div>

<script>
(function () {
  var STORE = 'switchdeck.token';
  var CFG = 'switchdeck.cfg';

  var cfg = Object.assign({
    sens: 1.4, accel: 1.8, scroll: 2.0, smooth: 1, keepalive: 120, click: 0.35, natural: true, tapClick: true
  }, readCfg());

  function readCfg() {
    try { return JSON.parse(localStorage.getItem(CFG) || '{}'); } catch (e) { return {}; }
  }
  function saveCfg() {
    try { localStorage.setItem(CFG, JSON.stringify(cfg)); } catch (e) {}
  }

  var el = function (id) { return document.getElementById(id); };
  var ws = null, pingTimer = null, retry = null;
  var rtts = [], sentThisSecond = 0, rateWindow = Date.now();
  var minSendGap = 1000 / 60;   // replaced by the Mac's real refresh on hello

  // ---------- click sound ----------
  // The tablet has no haptic motor, so touch feedback has to be audible. The
  // sound is synthesised rather than shipped as a file: one short noise burst
  // through a bandpass filter, which is what a key tick actually is. Keeps the
  // page self-contained and costs nothing to load.
  var audio = null, noise = null;

  function ensureAudio() {
    if (!audio) {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      audio = new Ctor();
      // ~25 ms of noise with a cubic decay — the decay is what stops it
      // sounding like static and makes it read as a tick.
      var length = Math.floor(audio.sampleRate * 0.025);
      noise = audio.createBuffer(1, length, audio.sampleRate);
      var data = noise.getChannelData(0);
      for (var i = 0; i < length; i += 1) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 3);
      }
    }
    // Mobile browsers start suspended until a gesture; every caller is one.
    if (audio.state === 'suspended') audio.resume();
    return audio;
  }

  function clickSound(deep) {
    if (!cfg.click) return;
    var ctx = ensureAudio();
    if (!ctx) return;

    var source = ctx.createBufferSource();
    source.buffer = noise;

    var filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    // Wide keys get a lower tick, like a real keyboard. The jitter keeps a fast
    // run of keys from sounding like one machine gun note.
    var base = deep ? 1250 : 2100;
    filter.frequency.value = base * (0.92 + Math.random() * 0.16);
    filter.Q.value = 1.1;

    var gain = ctx.createGain();
    gain.gain.value = cfg.click * (deep ? 1.15 : 1);

    source.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    source.start();
  }

  // ---------- transport ----------
  function send(frame) {
    if (!ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify(frame));
    sentThisSecond += 1;
  }

  function setStatus(text, cls) {
    el('status').textContent = text;
    el('status').className = 'pill ' + cls;
  }

  function connect(token) {
    if (!token) { el('pair').style.display = 'flex'; setStatus('belum dipasangkan', 'down'); return; }
    el('pair').style.display = 'none';
    setStatus('nyambungin…', 'mid');
    var proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws?t=' + encodeURIComponent(token));

    ws.onopen = function () {
      setStatus('nyambung', 'up');
      startPing();
    };

    ws.onmessage = function (ev) {
      var f; try { f = JSON.parse(ev.data); } catch (e) { return; }
      if (f.t === 'hello') {
        el('host').textContent = f.host;
        // No point sending motion faster than the Mac can draw the cursor: the
        // extra packets cost airtime on a loaded link and main-thread time here,
        // and land on a frame that is never rendered.
        if (f.refreshHz > 0) minSendGap = 1000 / f.refreshHz;
        renderDeck(f.deck);
        if (f.trusted === false) {
          el('warn').style.display = 'block';
          el('warn').textContent = 'Mac belum ngasih izin Accessibility — semua gerakan bakal dibuang diam-diam. Jalanin `make doctor` di sana.';
        }
      } else if (f.t === 'pong') {
        pushRtt(Date.now() - f.ts);
      } else if (f.t === 'ack') {
        flash(f.id, 'ok');
      } else if (f.t === 'err') {
        flash(f.id, 'fail');
      }
    };

    ws.onclose = function (ev) {
      clearInterval(pingTimer);
      var rejected = ev.code === 1006 && el('status').textContent === 'nyambungin…';
      setStatus(rejected ? 'token ditolak' : 'putus', 'down');
      if (rejected) {
        try { localStorage.removeItem(STORE); } catch (e) {}
        el('pair').style.display = 'flex';
        return;
      }
      clearTimeout(retry);
      retry = setTimeout(function () { connect(token); }, 1500);
    };
  }

  // Doubles as a keepalive. Latency measured while idle was far worse than
  // under load (p95 438 ms idle vs 135 ms active), which is backwards for a
  // congested link and is the signature of the tablet's wifi radio dozing
  // between packets. A steady trickle keeps it awake; the packets are ~30 bytes
  // so the only real cost is battery.
  function startPing() {
    clearInterval(pingTimer);
    pingTimer = setInterval(function () {
      send({ t: 'ping', ts: Date.now() });
    }, cfg.keepalive);
  }

  function pushRtt(ms) {
    rtts.push(ms);
    if (rtts.length > 60) rtts.shift();
    var sorted = rtts.slice().sort(function (a, b) { return a - b; });
    var p = function (q) { return sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * q))]; };
    el('lat').textContent = 'p50 ' + p(0.5) + ' / p95 ' + p(0.95) + ' ms (' + rtts.length + ')';
  }

  setInterval(function () {
    var now = Date.now();
    var secs = (now - rateWindow) / 1000;
    el('rate').textContent = Math.round(sentThisSecond / secs) + ' f/s';
    sentThisSecond = 0; rateWindow = now;
  }, 1000);

  // ---------- deck ----------
  // Split across both palm rests so the trackpad stays centred, like a MacBook.
  function renderDeck(keys) {
    var left = el('deck-l'), right = el('deck-r');
    left.innerHTML = ''; right.innerHTML = '';
    (keys || []).forEach(function (k, index) {
      var aside = index % 2 === 0 ? left : right;
      var b = document.createElement('button');
      b.className = 'key'; b.id = 'key-' + k.id;
      b.innerHTML = '<span>' + k.label + '</span>' + (k.hint ? '<span class="hint">' + k.hint + '</span>' : '');
      b.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        b.setPointerCapture(e.pointerId);
        b.classList.add('down');
        clickSound(true);
        send({ t: 'macro', id: k.id });
      });
      ['pointerup', 'pointercancel'].forEach(function (name) {
        b.addEventListener(name, function () { b.classList.remove('down'); });
      });
      aside.appendChild(b);
    });
  }
  function flash(id, cls) {
    var e = el('key-' + id); if (!e) return;
    e.classList.add(cls); setTimeout(function () { e.classList.remove(cls); }, 240);
  }

  // ---------- trackpad ----------
  var pad = el('pad');
  var pointers = new Map();
  var accX = 0, accY = 0, accSX = 0, accSY = 0;   // fractional carry
  var gestureMax = 0, gestureStart = 0, gestureMoved = 0;
  var lastTapEnd = 0, dragging = false;
  var mode = null;         // null | 'move' | 'scroll' — locked once decided
  var primaryId = null;    // only the first finger down drives the cursor
  var smoothSpeed = 0;

  var TAP_MS = 220;       // longer than this is a press, not a tap
  var TAP_SLOP = 14;      // css px of wander still counted as a tap
  var DRAG_GAP_MS = 280;  // tap, then press again this soon = drag

  function gain(speed) {
    // speed in css px per ms. Slow stays near 1:1 for precision; fast multiplies
    // so the cursor can cross the screen without lifting a finger.
    var capped = Math.min(speed, 3);
    return cfg.sens * (1 + cfg.accel * (capped / 3));
  }

  pad.addEventListener('pointerdown', function (e) {
    pad.setPointerCapture(e.pointerId);
    if (pointers.size === 0) {
      gestureStart = performance.now();
      gestureMax = 0; gestureMoved = 0;
      mode = 'move';
      primaryId = e.pointerId;
      smoothSpeed = 0;
      // A press soon after a tap means drag: hold the button down for the move.
      if (cfg.tapClick && performance.now() - lastTapEnd < DRAG_GAP_MS) {
        dragging = true;
        send({ t: 'b', btn: 'l', d: 1 });
      }
    }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, t: performance.now() });
    gestureMax = Math.max(gestureMax, pointers.size);
    if (pointers.size >= 2 && mode === 'move') {
      // A second finger turns the whole gesture into a scroll, and it stays a
      // scroll until every finger is up. Without the lock, lifting one finger
      // first hands the remaining one back to the cursor and it jumps.
      mode = 'scroll';
      accX = 0; accY = 0;
    }
    pad.classList.add('active');
    updateBadge();
  });

  pad.addEventListener('pointermove', function (e) {
    var prev = pointers.get(e.pointerId);
    if (!prev) return;
    var now = performance.now();
    var dx = e.clientX - prev.x;
    var dy = e.clientY - prev.y;
    // Floor the gap well above 1 ms: at 90 Hz a stray 1 ms timestamp turns a
    // normal step into an implausible speed.
    var dt = Math.max(4, now - prev.t);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, t: now });
    gestureMoved += Math.abs(dx) + Math.abs(dy);

    if (mode === 'scroll') {
      // Halved because both fingers report the same motion and we would
      // otherwise scroll at double speed.
      var dir = cfg.natural ? 1 : -1;
      accSX += (dx * cfg.scroll * dir) / 2;
      accSY += (dy * cfg.scroll * dir) / 2;
      return;
    }

    if (e.pointerId !== primaryId) return;

    // Raw per-event speed is noisy, and a noisy speed slams the gain between its
    // floor and ceiling frame to frame — which feels like the cursor twitching.
    // Smooth it so the gain moves gradually.
    var speed = Math.hypot(dx, dy) / dt;
    smoothSpeed = smoothSpeed * 0.7 + speed * 0.3;
    var g = gain(smoothSpeed);
    accX += dx * g;
    accY += dy * g;
  }, { passive: true });

  function release(e) {
    pointers.delete(e.pointerId);
    if (pointers.size > 0) { updateBadge(); return; }

    pad.classList.remove('active');
    var held = performance.now() - gestureStart;
    mode = null; primaryId = null;

    if (dragging) {
      send({ t: 'b', btn: 'l', d: 0 });
      dragging = false;
    } else if (cfg.tapClick && held < TAP_MS && gestureMoved < TAP_SLOP) {
      // A two-finger tap locks into 'scroll' mode on the second finger down,
      // but nothing moved, so it is still a right click rather than a scroll.
      var button = gestureMax >= 2 ? 'r' : 'l';
      clickSound(true);
      send({ t: 'b', btn: button, d: 1 });
      send({ t: 'b', btn: button, d: 0 });
      lastTapEnd = performance.now();
    }
    updateBadge();
  }
  pad.addEventListener('pointerup', release);
  pad.addEventListener('pointercancel', release);

  function updateBadge() {
    el('badge').textContent = pointers.size ? pointers.size + ' jari' : '';
    el('padhint').style.opacity = pointers.size ? 0 : 1;
  }

  // One flush per frame. The tablet samples at ~93 Hz and animation frames run
  // at ~90 Hz — close but not locked, so frames alternate between catching two
  // pointer events and none. Emitting the raw accumulation reproduces that beat
  // as big-nothing-big steps, which is what a long fast swipe looked like.
  //
  // So emit a fraction of what is pending and leave the rest for the next
  // frame. Distance is conserved exactly (the remainder stays in the buffer,
  // which also carries sub-pixel motion), bursts get spread over a couple of
  // frames, and the cost is one or two frames of lag. cfg.smooth = 1 opts out.
  function drain(pending, take) {
    var out = pending * take;
    var whole = Math.trunc(out);
    return whole;
  }

  var lastSendAt = 0;

  function flush(now) {
    // Animation frames run at the tablet's refresh (~90 Hz), which is faster
    // than the Mac's. Skipping a frame loses nothing: the deltas stay in the
    // buffer and merge into the next send.
    if (now - lastSendAt < minSendGap) { requestAnimationFrame(flush); return; }
    lastSendAt = now;

    var take = pointers.size ? cfg.smooth : 1;   // no finger down: land it now

    var ix = drain(accX, take), iy = drain(accY, take);
    if (ix || iy) { accX -= ix; accY -= iy; send({ t: 'm', dx: ix, dy: iy }); }

    var sx = drain(accSX, take), sy = drain(accSY, take);
    if (sx || sy) { accSX -= sx; accSY -= sy; send({ t: 's', dx: sx, dy: sy }); }

    requestAnimationFrame(flush);
  }
  requestAnimationFrame(flush);

  // ---------- keyboard ----------
  // Two paths, on purpose:
  //
  //   typing    -> {t:'txt'} with the exact character. Layout-independent: the
  //                Mac types what we asked for regardless of its keyboard
  //                layout, and we never need a shifted-character table on the
  //                Swift side.
  //   shortcuts -> real keycodes with the modifier physically held down. A
  //                chord has to arrive as a chord; sending "c" as text while
  //                Command is down would type a letter, not copy.
  //
  // Modifiers are real key events rather than just flags on the target key, so
  // Cmd+Tab behaves like hardware: the switcher appears while Command is held.
  var MOD_CODE = { cmd: 55, shift: 56, opt: 58, ctrl: 59 };
  var mods = { cmd: 0, shift: 0, opt: 0, ctrl: 0 };   // 0 off, 1 one-shot, 2 locked
  // Caps Lock is handled entirely on this side. macOS treats caps as a hardware
  // toggle with its own state rather than an ordinary key, so posting keycode 57
  // does nothing — and it does not need to, since we send the literal character
  // anyway. Local toggle gives exactly the behaviour without touching the Mac's
  // own caps state.
  var capsOn = false;
  // fn is local too: it selects which role the function row plays, and never
  // needs to reach the Mac.
  var fnOn = false;

  // Layout mirrors an Apple Magic Keyboard (US): same key names, same widths,
  // same inverted-T arrows. Widths are in units where a letter key is 1 and
  // every row totals 15.
  function ch(l, u, c, w) { return { k: 'ch', l: l, u: u, c: c, w: w }; }
  function sp(l, c, w, sub) { return { k: 'sp', l: l, c: c, w: w, sub: sub }; }
  function md(l, m, c, w, sub) { return { k: 'md', l: l, m: m, c: c, w: w, sub: sub }; }
  function mk(l, code, w) { return { k: 'mk', l: l, media: code, w: w }; }

  // NX_KEYTYPE_*: volume up 0, down 1, brightness up 2, down 3, mute 7,
  // play 16, next 17, previous 18.
  //
  // Every function key carries BOTH roles, exactly like the hardware: the
  // printed action by default, and the plain F-key when fn is held. Without
  // that there is no way to reach F1-F12 at all, which is what "F1-F12 ga
  // jalan" turned out to mean.
  function fk(icon, num, fcode, opts) {
    return Object.assign({ k: 'fn', l: icon, num: 'F' + num, fkey: fcode, w: 1.125 }, opts);
  }

  var ROWS = [
    [sp('esc', 53, 1.5),
     fk('🔅', 1, 122, { media: 3 }), fk('🔆', 2, 120, { media: 2 }),
     fk('▦', 3, 99, { sc: 126, scFlags: ['ctrl'] }),   // Mission Control = ⌃↑
     fk('🔍', 4, 118, { sc: 49, scFlags: ['cmd'] }),   // Spotlight = ⌘space
     fk('🎙', 5, 96), fk('🌙', 6, 97),                  // no equivalent: plain F-key only
     fk('⏮', 7, 98, { media: 18 }), fk('⏯', 8, 100, { media: 16 }),
     fk('⏭', 9, 101, { media: 17 }), fk('🔇', 10, 109, { media: 7 }),
     fk('🔉', 11, 103, { media: 1 }), fk('🔊', 12, 111, { media: 0 })],

    [ch('`', '~', 50), ch('1', '!', 18), ch('2', '@', 19), ch('3', '#', 20), ch('4', '$', 21),
     ch('5', '%', 23), ch('6', '^', 22), ch('7', '&', 26), ch('8', '*', 28), ch('9', '(', 25),
     ch('0', ')', 29), ch('-', '_', 27), ch('=', '+', 24), sp('delete', 51, 2)],

    [sp('tab', 48, 1.5, '⇥'), ch('q', 'Q', 12), ch('w', 'W', 13), ch('e', 'E', 14), ch('r', 'R', 15),
     ch('t', 'T', 17), ch('y', 'Y', 16), ch('u', 'U', 32), ch('i', 'I', 34), ch('o', 'O', 31),
     ch('p', 'P', 35), ch('[', '{', 33), ch(']', '}', 30), ch('\\', '|', 42, 1.5)],

    [{ k: 'caps', l: 'caps lock', w: 1.75, sub: '⇪' }, ch('a', 'A', 0), ch('s', 'S', 1),
     ch('d', 'D', 2), ch('f', 'F', 3), ch('g', 'G', 5), ch('h', 'H', 4), ch('j', 'J', 38),
     ch('k', 'K', 40), ch('l', 'L', 37), ch(';', ':', 41), ch("'", '"', 39),
     sp('return', 36, 2.25, '↩')],

    [md('shift', 'shift', 56, 2.25, '⇧'), ch('z', 'Z', 6), ch('x', 'X', 7), ch('c', 'C', 8),
     ch('v', 'V', 9), ch('b', 'B', 11), ch('n', 'N', 45), ch('m', 'M', 46), ch(',', '<', 43),
     ch('.', '>', 47), ch('/', '?', 44), md('shift', 'shift', 60, 2.75, '⇧')],

    [{ k: 'fnlock', l: 'fn', w: 1, sub: '🌐' }, md('control', 'ctrl', 59, 1, '⌃'), md('option', 'opt', 58, 1, '⌥'),
     md('command', 'cmd', 55, 1.25, '⌘'), sp(' ', 49, 5.5),
     md('command', 'cmd', 55, 1.25, '⌘'), md('option', 'opt', 61, 1, '⌥'),
     { k: 'arrows' }]
  ];

  function activeMods() {
    return Object.keys(mods).filter(function (m) { return mods[m] > 0; });
  }

  function setMod(name, state) {
    if (mods[name] === state) return;
    if (state === 0 && mods[name] > 0) send({ t: 'k', code: MOD_CODE[name], d: 0 });
    if (state > 0 && mods[name] === 0) send({ t: 'k', code: MOD_CODE[name], d: 1 });
    mods[name] = state;
    paintMods();
  }

  // Holding Shift with one finger and tapping a letter with another is not a
  // hardware limit — the tablet reports five simultaneous touch points. It did
  // not work because modifiers were tap-only. Now a modifier press holds the
  // key down for real; on release we look at whether anything was typed while
  // it was down. If something was, it behaves as a hold and releases. If not,
  // it was a tap, and falls back to the sticky cycle (latch, lock, off).
  var holdState = {};   // modName -> { prev, used }

  function modDown(name) {
    if (holdState[name]) return;
    holdState[name] = { prev: mods[name], used: false };
    if (mods[name] === 0) setMod(name, 1);
  }

  function modUp(name) {
    var hold = holdState[name];
    if (!hold) return;
    delete holdState[name];
    if (hold.used) { setMod(name, 0); return; }   // was a real hold
    setMod(name, (hold.prev + 1) % 3);            // was a tap
  }

  function markModsUsed() {
    Object.keys(holdState).forEach(function (name) { holdState[name].used = true; });
  }

  function releaseOneShots() {
    Object.keys(mods).forEach(function (m) {
      // A finger still on the key means it is a hold, not a spent one-shot.
      if (mods[m] === 1 && !holdState[m]) setMod(m, 0);
    });
  }
  function releaseAllMods() {
    Object.keys(mods).forEach(function (m) { setMod(m, 0); });
  }

  function paintMods() {
    Array.prototype.forEach.call(document.querySelectorAll('.kkey.mod'), function (b) {
      var state = mods[b.getAttribute('data-mod')] || 0;
      b.classList.toggle('once', state === 1);
      b.classList.toggle('lock', state === 2);
    });
    var caps = document.querySelector('.kkey.caps');
    if (caps) caps.classList.toggle('lock', capsOn);
    var fnKey = document.querySelector('.kkey.fnlock');
    if (fnKey) fnKey.classList.toggle('lock', fnOn);
    ROWS[0].forEach(function (key) {
      if (key.k === 'fn' && key.numEl) key.numEl.parentNode.classList.toggle('fnactive', fnOn);
    });
    paintLabels();
  }

  // The label has to show what the key will actually produce, otherwise Shift
  // is invisible: the row still reads 1 2 3 when it would type ! @ #.
  function paintLabels() {
    ROWS.forEach(function (row) {
      row.forEach(function (key) {
        if (key.k === 'ch' && key.el) key.el.textContent = charFor(key);
      });
    });
  }

  var isLetter = function (key) { return /^[a-z]$/.test(key.l); };

  function charFor(key) {
    // Caps affects letters only, and Caps+Shift gives lowercase — same as the
    // Mac's own keyboard. Symbols ignore caps entirely.
    if (isLetter(key)) return (capsOn ? !mods.shift : !!mods.shift) ? key.u : key.l;
    return mods.shift ? key.u : key.l;
  }

  function pressFunctionKey(key) {
    markModsUsed();
    if (fnOn || (!key.media && !key.sc)) {
      // fn held, or nothing better to send: the plain F-key.
      send({ t: 'k', code: key.fkey, d: 1 });
      send({ t: 'k', code: key.fkey, d: 0 });
      return;
    }
    if (key.media !== undefined) {
      send({ t: 'media', media: key.media, d: 1 });
      send({ t: 'media', media: key.media, d: 0 });
      return;
    }
    // Mission Control and Spotlight have no media code, so they go as their
    // real shortcuts — with the modifier physically held, not as a flag. Flags
    // alone were why these two did nothing.
    var mod = key.scFlags[0] === 'cmd' ? 55 : 59;
    send({ t: 'k', code: mod, d: 1 });
    send({ t: 'k', code: key.sc, d: 1, flags: key.scFlags });
    send({ t: 'k', code: key.sc, d: 0, flags: key.scFlags });
    send({ t: 'k', code: mod, d: 0 });
  }

  function pressKey(key) {
    markModsUsed();
    var flags = activeMods();
    var chord = mods.cmd || mods.ctrl || mods.opt;

    if (key.k === 'ch' && !chord) {
      send({ t: 'txt', s: charFor(key) });
    } else {
      var frame = { t: 'k', code: key.c, d: 1 };
      if (flags.length) frame.flags = flags;
      send(frame);
      send({ t: 'k', code: key.c, d: 0, flags: flags.length ? flags : undefined });
    }
    releaseOneShots();
  }

  function buildKey(key) {
    var b = document.createElement('button');
    b.className = 'kkey'
      + (key.k === 'md' ? ' mod' : '')
      + (key.k === 'caps' ? ' mod caps' : '')
      + (key.k === 'fnlock' ? ' mod fnlock' : '');
    b.style.flexGrow = key.w || 1;

    if (key.sub) {
      var g = document.createElement('span');
      g.className = 'glyph';
      g.textContent = key.sub;
      b.appendChild(g);
    }
    var label = document.createElement('span');
    label.className = key.sub || key.l.length > 2 ? 'sub' : '';
    label.textContent = key.l;
    b.appendChild(label);
    key.el = label;

    // The function row showed icons only, which left no way to tell F1 from F2.
    // The hardware prints both; so do we.
    if (key.k === 'fn') {
      var num = document.createElement('span');
      num.className = 'fnum';
      num.textContent = key.num;
      b.appendChild(num);
      key.numEl = num;
    }

    // pointerdown, not click. Fast tapping on glass loses click events to the
    // browser's own double-tap handling, which is what dropped letters while
    // typing. pointerdown fires on contact and is never coalesced.
    var act, onUp;
    if (key.k === 'md') {
      b.setAttribute('data-mod', key.m);
      act = function () { modDown(key.m); };
      onUp = function () { modUp(key.m); };
    } else if (key.k === 'caps') {
      act = function () { capsOn = !capsOn; paintMods(); };
    } else if (key.k === 'mk') {
      act = function () {
        send({ t: 'media', media: key.media, d: 1 });
        send({ t: 'media', media: key.media, d: 0 });
      };
    } else if (key.k === 'fn') {
      act = function () { pressFunctionKey(key); };
    } else if (key.k === 'fnlock') {
      act = function () { fnOn = !fnOn; paintMods(); };
    } else {
      act = function () { pressKey(key); };
    }
    // Hold to repeat, like a real keyboard. Only typing keys repeat — repeating
    // a modifier or a media key would be nonsense.
    var repeats = key.k === 'ch' || key.k === 'sp';
    var delayTimer = null, repeatTimer = null;

    function stop() {
      clearTimeout(delayTimer); clearInterval(repeatTimer);
      delayTimer = repeatTimer = null;
    }

    b.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      b.setPointerCapture(e.pointerId);
      b.classList.add('down');
      clickSound(key.k === 'md' || key.k === 'caps' || key.k === 'fnlock' || (key.w || 1) >= 1.5);
      act();
      if (!repeats) return;
      delayTimer = setTimeout(function () {
        repeatTimer = setInterval(function () { clickSound(true); act(); }, 45);
      }, 450);
    });

    ['pointerup', 'pointercancel'].forEach(function (name) {
      b.addEventListener(name, function () {
        stop();
        b.classList.remove('down');
        if (onUp) onUp();
      });
    });
    return b;
  }

  function buildArrows() {
    var wrap = document.createElement('div');
    wrap.className = 'arrows';
    wrap.appendChild(buildKey(sp('←', 123)));
    var col = document.createElement('div');
    col.className = 'col';
    col.appendChild(buildKey(sp('↑', 126)));
    col.appendChild(buildKey(sp('↓', 125)));
    wrap.appendChild(col);
    wrap.appendChild(buildKey(sp('→', 124)));
    return wrap;
  }

  function renderKeyboard() {
    var kb = el('kb');
    kb.innerHTML = '';
    ROWS.forEach(function (row, index) {
      var r = document.createElement('div');
      r.className = 'krow' + (index === 0 ? ' fnrow' : '');
      row.forEach(function (key) {
        r.appendChild(key.k === 'arrows' ? buildArrows() : buildKey(key));
      });
      kb.appendChild(r);
    });
    paintMods();
  }
  renderKeyboard();

  // ---------- keyboard drawer ----------
  var kbOpen = false;

  function setKeyboard(open) {
    kbOpen = open;
    // Never leave a modifier physically held down on the Mac when the keyboard
    // goes away — there would be no way to release it from here.
    if (!open) releaseAllMods();
    el('kb').classList.toggle('on', open);
    el('kbtoggle').classList.toggle('on', open);
    try { localStorage.setItem('switchdeck.kb', open ? '1' : '0'); } catch (e) {}
  }

  el('kbtoggle').addEventListener('click', function () { setKeyboard(!kbOpen); });
  try { setKeyboard(localStorage.getItem('switchdeck.kb') === '1'); } catch (e) { setKeyboard(false); }

  // ---------- fullscreen ----------
  el('fs').addEventListener('click', function () {
    var root = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    }
  });
  document.addEventListener('fullscreenchange', function () {
    el('fs').classList.toggle('on', !!document.fullscreenElement);
  });

  // ---------- settings ----------
  function bindRange(id, key, fmt) {
    var input = el('s-' + id), out = el('v-' + id);
    input.value = cfg[key];
    out.textContent = fmt(cfg[key]);
    input.addEventListener('input', function () {
      cfg[key] = parseFloat(input.value);
      out.textContent = fmt(cfg[key]);
      saveCfg();
    });
  }
  function bindToggle(id, key) {
    var input = el('s-' + id);
    input.checked = !!cfg[key];
    input.addEventListener('change', function () { cfg[key] = input.checked; saveCfg(); });
  }
  bindRange('sens', 'sens', function (v) { return v.toFixed(1) + '×'; });
  bindRange('accel', 'accel', function (v) { return v.toFixed(1); });
  bindRange('scroll', 'scroll', function (v) { return v.toFixed(1) + '×'; });
  bindRange('smooth', 'smooth', function (v) { return v >= 1 ? 'mentah' : v.toFixed(2); });
  bindRange('keepalive', 'keepalive', function (v) { return v + 'ms'; });
  bindRange('click', 'click', function (v) { return v === 0 ? 'mati' : Math.round(v * 100) + '%'; });
  // Preview the change as it is dragged, otherwise the slider is guesswork.
  el('s-click').addEventListener('input', function () { clickSound(false); });
  el('s-keepalive').addEventListener('change', function () { if (ws && ws.readyState === 1) startPing(); });
  bindToggle('natural', 'natural');
  bindToggle('tap', 'tapClick');
  el('gear').addEventListener('click', function () { el('settings').classList.toggle('open'); });
  el('close').addEventListener('click', function () { el('settings').classList.remove('open'); });

  // ---------- pairing ----------
  el('save').addEventListener('click', function () {
    var v = el('token').value.trim();
    if (!v) return;
    try { localStorage.setItem(STORE, v); } catch (e) {}
    connect(v);
  });

  function readToken() {
    var m = location.hash.match(/t=([a-f0-9]+)/i);
    if (m) {
      try { localStorage.setItem(STORE, m[1]); } catch (e) {}
      history.replaceState(null, '', location.pathname);
      return m[1];
    }
    try { return localStorage.getItem(STORE); } catch (e) { return null; }
  }

  connect(readToken());
})();
</script>
</body>
</html>
