<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SwitchDeck</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101216; --panel: #181b21; --line: #262a33; --dim: #8b93a1; --fg: #e6e8ec;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0; padding: 10px; display: flex; flex-direction: column; gap: 10px;
    font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  header { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .host { font-weight: 700; }
  .pill { font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .up { background: #10331f; color: #57d68b; border: 1px solid #1d5c37; }
  .down { background: #34181b; color: #f2777f; border: 1px solid #5e2a2f; }
  .mid { background: #33290f; color: #e2b356; border: 1px solid #5c4a1d; }
  .metrics { margin-left: auto; display: flex; gap: 12px; color: var(--dim); font-size: 12px;
             font-variant-numeric: tabular-nums; }
  .gear { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
          background: var(--panel); color: var(--fg); font-size: 13px; }

  /* Both panels stay mounted. Opening the keyboard shrinks the trackpad
     instead of replacing it, so the deck never leaves the screen. */
  main { flex: 1 1 0; display: flex; gap: 10px; min-height: 0; }

  /* The palm rest must not accept touch. A hand resting there while typing
     would otherwise register as a pointer and corrupt the touches that matter.
     The area is inert; only the deck keys inside it opt back in. */
  .palm {
    flex: 1 1 0; display: flex; flex-direction: column; gap: 8px;
    min-width: 0; overflow-y: auto; pointer-events: none;
  }
  .palm .key { pointer-events: auto; }

  #pad {
    flex: 1.6 1 0; position: relative; border-radius: 14px;
    background: #14181f; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: #4b535f; font-size: 13px; text-align: center;
  }
  #pad.active { border-color: #3d6fd1; background: #161d2b; }
  #pad .badge {
    position: absolute; top: 10px; left: 12px; font-size: 12px; color: #78a9e8;
    font-variant-numeric: tabular-nums;
  }

  .key {
    flex: 0 0 auto; min-height: 52px; border-radius: 12px; border: 1px solid #2f3642;
    background: #1f2530; color: var(--fg); font-size: 15px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: transform .06s, background .12s, border-color .12s;
  }
  .key .hint { font-size: 11px; font-weight: 500; color: var(--dim); }
  .key span:first-child { font-size: 14px; line-height: 1.15; }
  .key.down { transform: scale(.96); background: #2b3341; }
  .key.ok { background: #10331f; border-color: #1d5c37; }
  .key.fail { background: #34181b; border-color: #5e2a2f; }

  .hosts { display: flex; gap: 5px; }
  .hosts button {
    padding: 5px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--dim); font-size: 12px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  /* A dot per host, so a machine that has dropped is visible before you switch
     to it and wonder why nothing moves. */
  .hosts button::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%; background: #5b636f;
  }
  .hosts button.host-on::before { background: #57d68b; }
  .hosts button.host-connecting::before { background: #e2b356; }
  .hosts button.host-rejected::before { background: #f2777f; }
  .hosts button.on { background: #1f2a3d; border-color: #3d6fd1; color: #cdd6e4; }

  .pages { display: flex; gap: 5px; }
  .pages button {
    padding: 5px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--dim); font-size: 12px; font-weight: 600;
  }
  .pages button.on { background: #1f2a3d; border-color: #3d6fd1; color: #cdd6e4; }
  #kbtoggle.on, #fs.on { background: #1f2a3d; border-color: #3d6fd1; color: #9dc0f5; }

  #kb { flex: 1.7 1 0; display: none; flex-direction: column; gap: 5px; min-height: 0; }
  #kb.on { display: flex; }
  /* Magic Keyboard proportions: every row is 15 units wide, and the function
     row sits at roughly two-thirds height like the real thing. */
  .krow { display: flex; gap: 5px; flex: 1 1 0; min-height: 0; }
  .krow.fnrow { flex: 0.62 1 0; }
  .kkey {
    flex: 1 1 0; border-radius: 7px; border: 1px solid #2f3642; background: #1f2530;
    color: var(--fg); font-size: 15px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1px; padding: 0; min-width: 0;
    line-height: 1.05;
  }
  .kkey .sub { font-size: 9px; color: var(--dim); letter-spacing: .02em; }
  .kkey .glyph { font-size: 13px; display: flex; }
  .kkey .glyph svg { width: 15px; height: 15px; }
  .krow.fnrow .kkey .glyph svg { width: 14px; height: 14px; }
  .kkey .fnum { font-size: 8px; color: #5b636f; letter-spacing: .04em; }
  .kkey.fnactive .fnum { color: #57d68b; }
  .kkey.fnactive .sub, .kkey.fnactive > span:first-child { opacity: .35; }
  /* The arrow cluster is an inverted T: full-height left and right, with up and
     down stacked in the middle column. */
  .arrows { display: flex; gap: 5px; flex: 3 1 0; min-width: 0; }
  .arrows .col { display: flex; flex-direction: column; gap: 5px; flex: 1 1 0; }
  .arrows .col .kkey { flex: 1 1 0; font-size: 12px; }
  /* Not :active. The browser treats activation as singular, so once a finger
     is holding Shift no other key can light up — and preventDefault on
     pointerdown suppresses it anyway. An explicit class is per-element and
     survives any number of simultaneous touches. */
  .kkey.down { background: #3a4560; border-color: #4d7ee0; }
  .kkey { touch-action: none; }
  .kkey.mod { background: #232936; color: var(--dim); font-size: 16px; }
  .kkey.mod.once { background: #1f2a3d; border-color: #3d6fd1; color: #9dc0f5; }
  .kkey.mod.lock { background: #10331f; border-color: #1d5c37; color: #57d68b; }
  .kkey.small { font-size: 12px; }


  #warn { display: none; background: #34181b; border: 1px solid #5e2a2f; color: #f2b0b5;
          border-radius: 10px; padding: 10px 12px; font-size: 12px; flex: 0 0 auto; }

  #settings {
    display: none; position: fixed; inset: auto 10px 10px 10px; z-index: 10;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; gap: 12px; flex-direction: column; max-height: 80vh; overflow-y: auto;
  }
  #settings.open { display: flex; }
  .row { display: flex; align-items: center; gap: 12px; }
  .row label { flex: 0 0 150px; font-size: 13px; color: var(--dim); }
  .row input[type=range] { flex: 1; }
  .picker { flex: 1; display: flex; gap: 6px; }
  .picker button {
    flex: 1; padding: 10px 4px; border-radius: 8px; border: 1px solid var(--line);
    background: #1f2530; color: var(--dim); font-size: 13px;
  }
  .picker button.on { background: #1f2a3d; border-color: #3d6fd1; color: #cdd6e4; }
  .row .val { flex: 0 0 52px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }

  #pair { display: none; flex-direction: column; gap: 10px; padding: 20px; }
  #pair input {
    padding: 16px; font-size: 34px; letter-spacing: .35em; text-align: center;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); font-variant-numeric: tabular-nums;
  }
  #pair button { padding: 14px; font-size: 16px; font-weight: 600; border-radius: 10px;
                 border: none; background: #3d6fd1; color: #fff; }
</style>
</head>
<body>

<header>
  <span class="host" id="host">SwitchDeck</span>
  <span class="pill mid" id="status">connecting</span>
  <span class="hosts" id="hosts"></span>
  <span class="pages" id="pages"></span>
  <span class="metrics">
    <span id="lat">— ms</span>
    <span id="rate">— f/s</span>
  </span>
  <button class="gear" id="kbtoggle" title="keyboard">⌨</button>
  <button class="gear" id="fs" title="fullscreen">⛶</button>
  <button class="gear" id="gear">⚙︎</button>
</header>

<div id="warn"></div>

<div id="pair">
  <p style="margin:0 0 4px;color:var(--dim);font-size:13px">Masukkan kode 6 digit yang dicetak di terminal Mac.</p>
  <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000"
         autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="save">Pasangkan</button>
  <p id="pairmsg" style="margin:0;font-size:13px;color:#f2777f;min-height:18px"></p>
</div>

<div id="kb"></div>

<main>
  <aside class="palm" id="deck-l"></aside>
  <div id="pad">
    <span class="badge" id="badge"></span>
  </div>
  <aside class="palm" id="deck-r"></aside>
</main>

<div id="settings">
  <div class="row"><label>Sensitivitas</label><input type="range" id="s-sens" min="0.4" max="3" step="0.1"><span class="val" id="v-sens"></span></div>
  <div class="row"><label>Akselerasi</label><input type="range" id="s-accel" min="0" max="4" step="0.1"><span class="val" id="v-accel"></span></div>
  <div class="row"><label>Ping / keepalive<br><span style="font-size:11px">kecil = radio wifi tetap bangun, boros baterai</span></label><input type="range" id="s-keepalive" min="40" max="1000" step="20"><span class="val" id="v-keepalive"></span></div>
  <div class="row"><label>Kehalusan gerak<br><span style="font-size:11px">(1.00 = mentah)</span></label><input type="range" id="s-smooth" min="0.25" max="1" step="0.05"><span class="val" id="v-smooth"></span></div>
  <div class="row"><label>Jenis suara</label><span class="picker" id="s-sound"></span></div>
  <div class="row"><label>Volume suara<br><span style="font-size:11px">0 = mati</span></label><input type="range" id="s-click" min="0" max="1" step="0.05"><span class="val" id="v-click"></span></div>
  <div class="row"><label>Kecepatan scroll</label><input type="range" id="s-scroll" min="0.5" max="5" step="0.1"><span class="val" id="v-scroll"></span></div>
  <div class="row"><label>Scroll natural</label><input type="checkbox" id="s-natural"></div>
  <div class="row"><label>Tap buat klik</label><input type="checkbox" id="s-tap"></div>
  <div class="row" style="align-items:flex-start">
    <label>Mac lain<br><span style="font-size:11px">alamat + kode 6 digit dari Mac itu</span></label>
    <span style="flex:1;display:flex;flex-direction:column;gap:6px">
      <span style="display:flex;gap:6px">
        <input id="h-addr" placeholder="192.168.1.50:8777" autocapitalize="off" spellcheck="false"
               style="flex:2;padding:10px;font-size:14px;letter-spacing:0;text-align:left">
        <input id="h-code" inputmode="numeric" maxlength="6" placeholder="000000"
               style="flex:1;padding:10px;font-size:14px;letter-spacing:.1em">
        <button class="gear" id="h-add">Tambah</button>
      </span>
      <span id="h-msg" style="font-size:12px;min-height:16px;color:var(--dim)"></span>
      <span id="h-list" style="display:flex;flex-direction:column;gap:4px"></span>
    </span>
  </div>
  <div class="row"><button class="gear" id="close" style="flex:1">Tutup</button></div>
</div>

<script>
(function () {
  var CFG = 'switchdeck.cfg';

  var cfg = Object.assign({
    sens: 1.4, accel: 1.8, scroll: 2.0, smooth: 1, keepalive: 120, click: 0.35, sound: 'tik', natural: true, tapClick: true
  }, readCfg());

  function readCfg() {
    try { return JSON.parse(localStorage.getItem(CFG) || '{}'); } catch (e) { return {}; }
  }
  function saveCfg() {
    try { localStorage.setItem(CFG, JSON.stringify(cfg)); } catch (e) {}
  }

  var el = function (id) { return document.getElementById(id); };
  var sentThisSecond = 0, rateWindow = Date.now();
  var minSendGap = 1000 / 60;   // replaced by the active host's real refresh

  // ---------- click sound ----------
  // The tablet has no haptic motor, so touch feedback has to be audible. The
  // sound is synthesised rather than shipped as a file: one short noise burst
  // through a bandpass filter, which is what a key tick actually is. Keeps the
  // page self-contained and costs nothing to load.
  var audio = null, noise = null;

  function ensureAudio() {
    if (!audio) {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      audio = new Ctor();
      // Flat noise, 120 ms. The decay is applied per sound by a gain envelope
      // rather than baked into the buffer, so one buffer serves every preset.
      var length = Math.floor(audio.sampleRate * 0.12);
      noise = audio.createBuffer(1, length, audio.sampleRate);
      var data = noise.getChannelData(0);
      for (var i = 0; i < length; i += 1) data[i] = Math.random() * 2 - 1;
    }
    // Mobile browsers start suspended until a gesture; every caller is one.
    if (audio.state === 'suspended') audio.resume();
    return audio;
  }

  // Each preset is a different synthesis approach, not the same click at a
  // different pitch — that is what makes them actually sound distinct.
  var SOUNDS = {
    tik: function (ctx, at, deep, vol) {
      // Noise through a narrow bandpass: a dry typewriter tick.
      shapedNoise(ctx, at, {
        type: 'bandpass', freq: (deep ? 1250 : 2100) * jitter(), q: 1.1,
        decay: 0.025, vol: vol
      });
    },
    thock: function (ctx, at, deep, vol) {
      // Muffled noise plus a low sine body: a mechanical keyboard thock.
      shapedNoise(ctx, at, {
        type: 'lowpass', freq: (deep ? 520 : 780) * jitter(), q: 0.7,
        decay: 0.055, vol: vol * 0.9
      });
      tone(ctx, at, {
        from: deep ? 105 : 135, to: deep ? 70 : 90,
        decay: 0.07, vol: vol * 0.55
      });
    },
    pop: function (ctx, at, deep, vol) {
      // A falling sine with no noise at all: the soft bubble of a phone keypad.
      tone(ctx, at, {
        from: (deep ? 700 : 920) * jitter(), to: deep ? 230 : 330,
        decay: 0.06, vol: vol
      });
    },
    tipis: function (ctx, at, deep, vol) {
      // Very short and very high: barely there, for quiet rooms.
      shapedNoise(ctx, at, {
        type: 'highpass', freq: (deep ? 2600 : 3800) * jitter(), q: 0.8,
        decay: 0.009, vol: vol * 0.8
      });
    }
  };

  // A touch of randomness per press, so a fast run of keys does not sound like
  // one note repeating.
  function jitter() { return 0.92 + Math.random() * 0.16; }

  function shapedNoise(ctx, at, opt) {
    var source = ctx.createBufferSource();
    source.buffer = noise;

    var filter = ctx.createBiquadFilter();
    filter.type = opt.type;
    filter.frequency.value = opt.freq;
    filter.Q.value = opt.q;

    var gain = ctx.createGain();
    gain.gain.setValueAtTime(opt.vol, at);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + opt.decay);

    source.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    source.start(at);
    source.stop(at + opt.decay + 0.01);
  }

  function tone(ctx, at, opt) {
    var osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(opt.from, at);
    osc.frequency.exponentialRampToValueAtTime(opt.to, at + opt.decay);

    var gain = ctx.createGain();
    gain.gain.setValueAtTime(opt.vol, at);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + opt.decay);

    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(at);
    osc.stop(at + opt.decay + 0.01);
  }

  function clickSound(deep) {
    if (!cfg.click) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var play = SOUNDS[cfg.sound] || SOUNDS.tik;
    // Floor the level: exponentialRampToValueAtTime cannot start from zero, and
    // a preset that scales the volume down could otherwise ramp upward.
    var level = Math.max(cfg.click * (deep ? 1.15 : 1), 0.002);
    play(ctx, ctx.currentTime, deep, level);
  }

  // ---------- transport: one connection per host ----------
  //
  // Decision K6: the tablet holds a socket to every host and sends to the
  // active one. The alternative — one Mac relaying to the other — was rejected
  // because it makes one machine a single point of failure for both and adds a
  // hop of latency. Keeping every socket open also makes switching instant:
  // the deck is already cached, so nothing has to be fetched on the switch.
  var HOSTS = 'switchdeck.hosts';
  var hosts = [];          // [{ id, name, url, token }]
  var conns = {};          // id -> { ws, state, deck, rtts, pingTimer, retry }
  var activeId = null;

  function loadHosts() {
    try { hosts = JSON.parse(localStorage.getItem(HOSTS) || '[]'); } catch (e) { hosts = []; }
    if (!Array.isArray(hosts)) hosts = [];
  }
  function saveHosts() {
    try { localStorage.setItem(HOSTS, JSON.stringify(hosts)); } catch (e) {}
  }

  function conn(id) {
    if (!conns[id]) conns[id] = { ws: null, state: 'off', deck: null, rtts: [], pingTimer: null, retry: null };
    return conns[id];
  }

  function send(frame) {
    var c = activeId && conns[activeId];
    if (!c || !c.ws || c.ws.readyState !== 1) return;
    c.ws.send(JSON.stringify(frame));
    sentThisSecond += 1;
  }

  function setState(id, state) {
    conn(id).state = state;
    renderHosts();
    if (id === activeId) paintStatus();
  }

  function paintStatus() {
    var c = activeId && conns[activeId];
    var state = c ? c.state : 'off';
    var label = { on: 'connected', connecting: 'connecting', off: 'disconnected',
                  rejected: 'pairing required' }[state] || state;
    el('status').textContent = label;
    el('status').className = 'pill ' + (state === 'on' ? 'up' : state === 'connecting' ? 'mid' : 'down');
  }

  function connectHost(host) {
    var c = conn(host.id);
    if (c.ws) { try { c.ws.close(); } catch (e) {} }
    setState(host.id, 'connecting');

    var proto = location.protocol === 'https:' ? 'wss' : 'ws';
    var ws = new WebSocket(proto + '://' + host.url + '/ws?t=' + encodeURIComponent(host.token));
    c.ws = ws;

    ws.onopen = function () {
      setState(host.id, 'on');
      clearInterval(c.pingTimer);
      c.pingTimer = setInterval(function () {
        if (ws.readyState === 1) ws.send(JSON.stringify({ t: 'ping', ts: Date.now() }));
      }, cfg.keepalive);
    };

    ws.onmessage = function (ev) {
      var f; try { f = JSON.parse(ev.data); } catch (e) { return; }

      if (f.t === 'hello') {
        if (f.host && f.host !== host.name) { host.name = f.host; saveHosts(); }
        c.deck = f.deck;
        c.trusted = f.trusted;
        if (f.refreshHz > 0) c.refreshHz = f.refreshHz;
        if (host.id === activeId) adoptHost(host.id);
        renderHosts();
      } else if (f.t === 'deck') {
        c.deck = f.deck;
        if (host.id === activeId) renderDeck(c.deck);
      } else if (f.t === 'pong') {
        pushRtt(host.id, Date.now() - f.ts);
      } else if (f.t === 'ack') {
        flash(f.id, 'ok');
      } else if (f.t === 'err') {
        flash(f.id, 'fail');
      }
    };

    ws.onclose = function (ev) {
      clearInterval(c.pingTimer);
      // 1006 straight after the upgrade is what a refused token looks like.
      var refused = ev.code === 1006 && c.state === 'connecting';
      setState(host.id, refused ? 'rejected' : 'off');
      if (refused) return;
      clearTimeout(c.retry);
      c.retry = setTimeout(function () { connectHost(host); }, 1500);
    };
  }

  /// Everything that follows the active host: deck, warning banner, and the
  /// send rate cap, which belongs to that Mac's refresh rate rather than ours.
  function adoptHost(id) {
    var c = conn(id);
    if (c.refreshHz > 0) minSendGap = 1000 / c.refreshHz;
    renderDeck(c.deck || { pages: [] });
    el('warn').style.display = c.trusted === false ? 'block' : 'none';
    if (c.trusted === false) {
      el('warn').textContent = 'Mac ini belum ngasih izin Accessibility — semua gerakan bakal dibuang diam-diam. Jalanin `make doctor` di sana.';
    }
    paintStatus();
    paintLatency();
  }

  function setActive(id) {
    if (activeId === id) return;
    activeId = id;
    try { localStorage.setItem('switchdeck.active', id); } catch (e) {}
    adoptHost(id);
    renderHosts();
  }

  function renderHosts() {
    var box = el('hosts');
    box.innerHTML = '';
    if (hosts.length < 2) return;   // one host needs no switcher
    hosts.forEach(function (h) {
      var c = conn(h.id);
      var b = document.createElement('button');
      b.className = (h.id === activeId ? 'on ' : '') + 'host-' + c.state;
      b.textContent = h.name || h.url;
      b.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        clickSound(true);
        setActive(h.id);
      });
      box.appendChild(b);
    });
  }

  function pushRtt(id, ms) {
    var c = conn(id);
    c.rtts.push(ms);
    if (c.rtts.length > 60) c.rtts.shift();
    if (id === activeId) paintLatency();
  }

  function paintLatency() {
    var c = activeId && conns[activeId];
    if (!c || !c.rtts.length) { el('lat').textContent = '— ms'; return; }
    var sorted = c.rtts.slice().sort(function (a, b) { return a - b; });
    var p = function (q) { return sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * q))]; };
    el('lat').textContent = 'p50 ' + p(0.5) + ' / p95 ' + p(0.95) + ' ms (' + c.rtts.length + ')';
  }

  function startAll() {
    loadHosts();
    if (!hosts.length) { el('pair').style.display = 'flex'; paintStatus(); return; }
    el('pair').style.display = 'none';
    var saved = null;
    try { saved = localStorage.getItem('switchdeck.active'); } catch (e) {}
    activeId = hosts.some(function (h) { return h.id === saved; }) ? saved : hosts[0].id;
    hosts.forEach(connectHost);
    renderHosts();

    var chord = mods.cmd || mods.ctrl || mods.opt;

    if (key.k === 'ch' && !chord) {
      send({ t: 'txt', s: charFor(key) });
    } else {
      var frame = { t: 'k', code: key.c, d: 1 };
      if (flags.length) frame.flags = flags;
      send(frame);
      send({ t: 'k', code: key.c, d: 0, flags: flags.length ? flags : undefined });
    }
    releaseOneShots();
  }

  function buildKey(key) {
    var b = document.createElement('button');
    b.className = 'kkey'
      + (key.k === 'md' ? ' mod' : '')
      + (key.k === 'caps' ? ' mod caps' : '')
      + (key.k === 'fnlock' ? ' mod fnlock' : '');
    b.style.flexGrow = key.w || 1;

    if (key.sub || key.iconSub) {
      var g = document.createElement('span');
      g.className = 'glyph';
      if (key.iconSub) g.innerHTML = icon(key.iconSub); else g.textContent = key.sub;
      b.appendChild(g);
    }
    var label = document.createElement('span');
    if (key.icon) {
      label.className = 'glyph';
      label.innerHTML = icon(key.icon);
    } else {
      label.className = key.sub || key.iconSub || key.l.length > 2 ? 'sub' : '';
      label.textContent = key.l;
    }
    b.appendChild(label);
    key.el = label;

    // The function row showed icons only, which left no way to tell F1 from F2.
    // The hardware prints both; so do we.
    if (key.k === 'fn') {
      var num = document.createElement('span');
      num.className = 'fnum';
      num.textContent = key.num;
      b.appendChild(num);
      key.numEl = num;
    }

    // pointerdown, not click. Fast tapping on glass loses click events to the
    // browser's own double-tap handling, which is what dropped letters while
    // typing. pointerdown fires on contact and is never coalesced.
    var act, onUp;
    if (key.k === 'md') {
      b.setAttribute('data-mod', key.m);
      act = function () { modDown(key.m); };
      onUp = function () { modUp(key.m); };
    } else if (key.k === 'caps') {
      act = function () { capsOn = !capsOn; paintMods(); };
    } else if (key.k === 'mk') {
      act = function () {
        send({ t: 'media', media: key.media, d: 1 });
        send({ t: 'media', media: key.media, d: 0 });
      };
    } else if (key.k === 'fn') {
      act = function () { pressFunctionKey(key); };
    } else if (key.k === 'fnlock') {
      act = function () { fnOn = !fnOn; paintMods(); };
    } else {
      act = function () { pressKey(key); };
    }
    // Hold to repeat, like a real keyboard. Only typing keys repeat — repeating
    // a modifier or a media key would be nonsense.
    var repeats = key.k === 'ch' || key.k === 'sp';
    var delayTimer = null, repeatTimer = null;

    function stop() {
      clearTimeout(delayTimer); clearInterval(repeatTimer);
      delayTimer = repeatTimer = null;
    }

    b.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      b.setPointerCapture(e.pointerId);
      b.classList.add('down');
      clickSound(key.k === 'md' || key.k === 'caps' || key.k === 'fnlock' || (key.w || 1) >= 1.5);
      act();
      if (!repeats) return;
      delayTimer = setTimeout(function () {
        repeatTimer = setInterval(function () { clickSound(true); act(); }, 45);
      }, 450);
    });

    ['pointerup', 'pointercancel'].forEach(function (name) {
      b.addEventListener(name, function () {
        stop();
        b.classList.remove('down');
        if (onUp) onUp();
      });
    });
    return b;
  }

  function buildArrows() {
    var wrap = document.createElement('div');
    wrap.className = 'arrows';
    wrap.appendChild(buildKey(sp('←', 123)));
    var col = document.createElement('div');
    col.className = 'col';
    col.appendChild(buildKey(sp('↑', 126)));
    col.appendChild(buildKey(sp('↓', 125)));
    wrap.appendChild(col);
    wrap.appendChild(buildKey(sp('→', 124)));
    return wrap;
  }

  function renderKeyboard() {
    var kb = el('kb');
    kb.innerHTML = '';
    ROWS.forEach(function (row, index) {
      var r = document.createElement('div');
      r.className = 'krow' + (index === 0 ? ' fnrow' : '');
      row.forEach(function (key) {
        r.appendChild(key.k === 'arrows' ? buildArrows() : buildKey(key));
      });
      kb.appendChild(r);
    });
    paintMods();
  }
  renderKeyboard();

  // ---------- keyboard drawer ----------
  var kbOpen = false;

  function setKeyboard(open) {
    kbOpen = open;
    // Never leave a modifier physically held down on the Mac when the keyboard
    // goes away — there would be no way to release it from here.
    if (!open) releaseAllMods();
    el('kb').classList.toggle('on', open);
    el('kbtoggle').classList.toggle('on', open);
    try { localStorage.setItem('switchdeck.kb', open ? '1' : '0'); } catch (e) {}
  }

  el('kbtoggle').addEventListener('click', function () { setKeyboard(!kbOpen); });
  try { setKeyboard(localStorage.getItem('switchdeck.kb') === '1'); } catch (e) { setKeyboard(false); }

  // ---------- fullscreen ----------
  el('fs').addEventListener('click', function () {
    var root = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    }
  });
  document.addEventListener('fullscreenchange', function () {
    el('fs').classList.toggle('on', !!document.fullscreenElement);
  });

  // ---------- settings ----------
  function bindRange(id, key, fmt) {
    var input = el('s-' + id), out = el('v-' + id);
    input.value = cfg[key];
    out.textContent = fmt(cfg[key]);
    input.addEventListener('input', function () {
      cfg[key] = parseFloat(input.value);
      out.textContent = fmt(cfg[key]);
      saveCfg();
    });
  }
  function bindToggle(id, key) {
    var input = el('s-' + id);
    input.checked = !!cfg[key];
    input.addEventListener('change', function () { cfg[key] = input.checked; saveCfg(); });
  }
  bindRange('sens', 'sens', function (v) { return v.toFixed(1) + '×'; });
  bindRange('accel', 'accel', function (v) { return v.toFixed(1); });
  bindRange('scroll', 'scroll', function (v) { return v.toFixed(1) + '×'; });
  bindRange('smooth', 'smooth', function (v) { return v >= 1 ? 'mentah' : v.toFixed(2); });
  bindRange('keepalive', 'keepalive', function (v) { return v + 'ms'; });
  bindRange('click', 'click', function (v) { return v === 0 ? 'mati' : Math.round(v * 100) + '%'; });
  // Preview as it is dragged, otherwise the slider is guesswork.
  el('s-click').addEventListener('input', function () { clickSound(false); });

  (function buildSoundPicker() {
    var names = { tik: 'Tik', thock: 'Thock', pop: 'Pop', tipis: 'Tipis' };
    var box = el('s-sound');
    Object.keys(names).forEach(function (key) {
      var b = document.createElement('button');
      b.textContent = names[key];
      b.className = cfg.sound === key ? 'on' : '';
      b.addEventListener('click', function () {
        cfg.sound = key;
        saveCfg();
        Array.prototype.forEach.call(box.children, function (c) { c.classList.remove('on'); });
        b.classList.add('on');
        clickSound(false);   // hear it immediately
      });
      box.appendChild(b);
    });
  })();
  el('s-keepalive').addEventListener('change', function () { if (ws && ws.readyState === 1) startPing(); });
  bindToggle('natural', 'natural');
  bindToggle('tap', 'tapClick');
  function renderHostList() {
    var box = el('h-list');
    box.innerHTML = '';
    hosts.forEach(function (h) {
      var row = document.createElement('span');
      row.style.cssText = 'display:flex;gap:8px;align-items:center;font-size:13px';
      var name = document.createElement('span');
      name.style.cssText = 'flex:1;color:var(--fg)';
      name.textContent = (h.name || h.url) + '  ·  ' + h.url;
      var del = document.createElement('button');
      del.className = 'gear';
      del.textContent = 'Hapus';
      del.addEventListener('click', function () {
        var c = conns[h.id];
        if (c) { clearTimeout(c.retry); clearInterval(c.pingTimer); if (c.ws) try { c.ws.close(); } catch (e) {} }
        delete conns[h.id];
        hosts = hosts.filter(function (x) { return x.id !== h.id; });
        saveHosts();
        if (activeId === h.id) activeId = hosts.length ? hosts[0].id : null;
        renderHostList();
        renderHosts();
        if (activeId) adoptHost(activeId); else location.reload();
      });
      row.appendChild(name); row.appendChild(del);
      box.appendChild(row);
    });
  }

  el('h-add').addEventListener('click', function () {
    var addr = el('h-addr').value.trim();
    var code = el('h-code').value.replace(/\D/g, '');
    if (!addr) { el('h-msg').textContent = 'alamatnya belum diisi'; return; }
    if (code.length !== 6) { el('h-msg').textContent = 'kodenya 6 angka'; return; }
    if (!/:\d+$/.test(addr)) addr += ':8777';   // port default, biar nggak perlu diketik
    pair(addr, code, el('h-msg')).then(function (ok) {
      if (ok) { el('h-addr').value = ''; el('h-code').value = ''; renderHostList(); }
    });
  });

  el('gear').addEventListener('click', function () {
    el('settings').classList.toggle('open');
    if (el('settings').classList.contains('open')) renderHostList();
  });
  el('close').addEventListener('click', function () { el('settings').classList.remove('open'); });

  // ---------- pairing ----------
  // The six-digit code is exchanged once for a long device token. The code is
  // short enough to read off a screen; the token is what guards the connection
  // from then on.
  function pair(address, code, msgEl) {
    var base = 'http://' + address;
    msgEl.style.color = 'var(--dim)';
    msgEl.textContent = 'memeriksa…';

    return fetch(base + '/pair', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ code: code })
    }).then(function (res) {
      return res.json().then(function (body) { return { status: res.status, body: body }; });
    }).then(function (r) {
      if (r.status === 200 && r.body.token) {
        var existing = hosts.filter(function (h) { return h.url === address; })[0];
        if (existing) {
          existing.token = r.body.token;
          existing.name = r.body.host || existing.name;
        } else {
          hosts.push({
            id: 'h' + Date.now() + Math.floor(Math.random() * 1000),
            name: r.body.host || address,
            url: address,
            token: r.body.token
          });
        }
        saveHosts();
        msgEl.textContent = '';
        el('pair').style.display = 'none';
        startAll();
        return true;
      }
      msgEl.style.color = '#f2777f';
      msgEl.textContent = r.status === 429
        ? 'terlalu banyak percobaan, tunggu ' + r.body.retryAfter + ' detik'
        : 'kode salah';
      return false;
    }).catch(function () {
      msgEl.style.color = '#f2777f';
      msgEl.textContent = 'tidak bisa menghubungi ' + address;
      return false;
    });
  }

  el('save').addEventListener('click', function () {
    var v = el('code').value.replace(/\D/g, '');
    if (v.length === 6) pair(location.host, v, el('pairmsg'));
  });
  el('code').addEventListener('input', function () {
    var v = el('code').value.replace(/\D/g, '');
    el('code').value = v;
    if (v.length === 6) pair(location.host, v, el('pairmsg'));
  });

  startAll();
})();
</script>
</body>
</html>
